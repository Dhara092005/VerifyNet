services:
  - type: web
    name: verifynet
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: VERIFYNET_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: VERIFYNET_ALLOW_REMOTE
        value: "true"
