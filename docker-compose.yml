services:
  verifynet:
    build: .
    container_name: verifynet
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      VERIFYNET_ALLOW_REMOTE: "true"
      VERIFYNET_ALLOW_REMOTE_AI: "false"
      VERIFYNET_ACCESS_TOKEN: "${VERIFYNET_ACCESS_TOKEN:?Set VERIFYNET_ACCESS_TOKEN in .env}"
      VERIFYNET_MODEL: "${VERIFYNET_MODEL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8765/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
